g{font-size:26px}\n  .question .q{font-size:clamp(26px,7vw,40px)}\n  .js .deck{height:min(520px,72svh)}\n  .scard{padding:30px 25px}\n  .scard h3{font-size:30px;margin-top:70px}\n  .scard p{font-size:16px;line-height:1.6}\n  .scard .big{font-size:100px;right:18px}\n  .scard .sym{font-size:260px;right:-30px;bottom:-90px}\n}\n\n/* reduced motion */\n.no-motion *{animation:none!important;transition:none!important}\n.no-motion .pin-track{height:auto}\n.no-motion .pin-stage{position:static;height:auto;display:block;padding:6vh var(--pad)}\n.no-motion .opening{padding:14vh var(--pad)}\n.no-motion .deck{height:auto}\n.no-motion .scard{position:static;transform:none!important;opacity:1!important;margin:0 auto 18px}\n.no-motion .deck-ui{display:none}\n.no-motion .tl::before{transform:none}\n.no-motion .tl-item{opacity:1!important;transform:none!important}\n.no-motion .tl-item .dot{transform:none;opacity:1}\n.no-motion [data-fx]{opacity:1!important;transform:none!important}\n.no-motion .hero-art{transform:none!important}\n.no-motion .hero-stage{position:static;height:auto;min-height:100svh;padding:120px 0 84px;display:flex;align-items:center}\n.no-motion .hw{opacity:1;transform:none}\n.no-motion .hero-fade{opacity:0}\n.no-motion .viz-col{position:static;height:52vh;height:52svh}\n.no-motion .step{min-height:0;padding:6vh 6vw}\n.no-motion .plate{opacity:1;transform:none}\n.no-motion .step-tail{display:none}\n.no-motion .page-progress{display:none}\n.no-motion .question .q{padding:18vh var(--pad)}\n.no-motion .orbit .cin{transform:none;opacity:1}\n.no-motion .orbit .lb,.no-motion .orbit .hub{opacity:1}\n\n.no-motion .ring .chord{stroke-dashoffset:0}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<a class=\"skip\" href=\"#main\">Skip to content<\u002Fa>\n\n<div class=\"ribbon\" role=\"navigation\" aria-label=\"Parts\">\n  <span class=\"brand\">Possibility Lab · <b>Abundance Accelerator<\u002Fb><\u002Fspan>\n  <nav id=\"partNav\">\n    <a href=\"#p1-s\">The Project<\u002Fa><a href=\"#p2-s\">The Agenda<\u002Fa><a href=\"#p3-s\">The Partnership<\u002Fa><a href=\"#p4-s\">The Abundance Consortium Policy Agenda<\u002Fa><a href=\"#p5-s\">The Horizon<\u002Fa>\n  <\u002Fnav>\n<\u002Fdiv>\n<div class=\"page-progress\" aria-hidden=\"true\"><i id=\"pageBar\"><\u002Fi><\u002Fdiv>\n\n<main id=\"main\" class=\"scrolly\">\n\n<!-- HERO -->\n<header class=\"hero\" data-scene=\"\" data-screen-label=\"Landing\">\n <div class=\"pin-track\" id=\"heroTrack\" data-progress=\"pin\" style=\"--track:180vh\">\n  <div class=\"pin-stage hero-stage\">\n  <div class=\"hero-bg\" aria-hidden=\"true\">\n    <div class=\"hero-art\" id=\"heroArt\"><image-slot id=\"hero-photo\" shape=\"rect\" placeholder=\"Hero photo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"hero-scrim\"><\u002Fdiv>\n    <div class=\"hero-fade\" id=\"heroFade\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"wrap\">\n    <p class=\"eyebrow hw\" data-w=\"0\">A three-year journey &nbsp;|&nbsp; told in one scroll<\u002Fp>\n    <h1><span class=\"hw\" data-w=\"1\">What happens when<\u002Fspan><span class=\"hw\" data-w=\"2\"><em>Possibility<\u002Fem><\u002Fspan><span class=\"hw\" data-w=\"3\">takes on Abundance?<\u002Fspan><\u002Fh1>\n    <p class=\"sub hw\" data-w=\"4\">With the Accelerator now coming to a close, we’re finally able to tell that story from start to finish.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"cue\" id=\"heroCue\" aria-hidden=\"true\"><span>scroll<\u002Fspan><span class=\"bar\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ESSENTIALS: 12 | 3 | 1 as a dot illustration -->\n<section class=\"essentials\" data-scene=\"\" aria-label=\"12 essentials, 3 years, 1 central focus\" data-screen-label=\"Essentials\">\n  <div class=\"pin-track\" id=\"essTrack\" data-progress=\"pin\" data-segments=\"3\" style=\"--track:340vh\">\n    <div class=\"pin-stage\">\n      <canvas id=\"essField\" aria-hidden=\"true\"><\u002Fcanvas>\n      <p class=\"ess-labels\"><span data-l=\"0\"><b>12<\u002Fb> essentials<\u002Fspan><i>|<\u002Fi><span data-l=\"1\"><b>3<\u002Fb> years<\u002Fspan><i>|<\u002Fi><span data-l=\"2\"><b>1<\u002Fb> central focus<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- OPENING: scroll-revealed paragraph -->\n<section class=\"opening\" data-scene=\"\" aria-label=\"Opening\" data-screen-label=\"Opening\">\n  <div class=\"pin-track\" data-progress=\"pin\" style=\"--track:280vh\">\n    <div class=\"pin-stage\">\n      <p data-reveal=\"\">The abundance agenda began with a call to build more, faster. Three years of evidence, critique, and dialogue pushed our focus further: identifying not just what gets built and what’s in the way, but who builds it, who benefits, and who decides. This is how our Abundance Accelerator launched <strong>People-Centered Policymaking<\u002Fstrong>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PART ONE: THE PROJECT -->\n<section class=\"engine\" id=\"p1-s\" data-scene=\"\" aria-labelledby=\"p1\" data-screen-label=\"Part One\">\n  <div class=\"part-mark\">\n    <p class=\"pl\">Part One<\u002Fp>\n    <h2 class=\"pt\" id=\"p1\">The <em>Project<\u002Fem><\u002Fh2>\n    <p class=\"ps\">From an “abundance of what?” to an “abundance for whom?”: why California needs a new model of people-centered policymaking.<\u002Fp>\n    <div class=\"tick\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"grid\">\n      <div class=\"viz-col\" aria-hidden=\"true\">\n        <canvas id=\"dotfield\"><\u002Fcanvas>\n        <div class=\"viz-label\" id=\"vizLabel\">01 | The Premise<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"steps\" id=\"steps\" data-progress=\"view\">\n\n        <div class=\"step\" data-label=\"01 | The Premise\" data-labelcolor=\"#f2eadf\" style=\"--ac:#f2eadf\">\n          <div class=\"plate\">\n          <p class=\"num\">01 | The Premise<\u002Fp>\n          <h2><span class=\"refrain\">What happens when…<\u002Fspan>you examine scarcity?<\u002Fh2>\n          <p>California has enough money, land, and talent to give everyone what they need. So why can’t people afford housing, food, or childcare? Abundance says cut the red tape and build more. Our work shows that the need for reform is real. But the question is how to meet it.<\u002Fp>\n          <div class=\"pull\"><a href=\"https://berkeley.box.com/s/yt8we3hdo5jut60rzhrwn2vl2tyg78zj\" target=\"_blank\" rel=\"noopener\">“71% of California voters agreed: ‘where I live, it is difficult for me to find suitable housing at a price I can afford.’”<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"step\" data-label=\"02 | The Gap\" data-labelcolor=\"#f28277\" style=\"--ac:#f28277\">\n          <div class=\"plate\">\n          <p class=\"num\">02 | The Gap<\u002Fp>\n          <h2><span class=\"refrain\">What happens when…<\u002Fspan>you notice who’s missing?<\u002Fh2>\n          <p>As the abundance movement caught on nationally, we asked critical questions. Who actually benefits when you cut regulations — workers, or just the companies building green energy and housing? And if you take power away from local communities to speed things up, who’s really deciding what gets built? And what legacy can those decisions leave behind?<\u002Fp>\n          <div class=\"pull\"><a href=\"https://berkeley.box.com/s/67ifo6hiv2axc5slaes1eno7yd7m8ri2\" target=\"_blank\" rel=\"noopener\">“We must be willing to humbly embrace the difficult political tradeoffs necessary to effectively serve people, while staying true to our values.”<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"step\" data-label=\"03 | The Collaboration\" data-labelcolor=\"#24a1bf\" style=\"--ac:#24a1bf\">\n          <div class=\"plate\">\n          <p class=\"num\">03 | The Collaboration<\u002Fp>\n          <h2><span class=\"refrain\">What happens when…<\u002Fspan>you bring in experts?<\u002Fh2>\n          <p>The Lab brought important skillsets to the abundance discourse — community engagement and public capacity-building. A consortium of experts brought another — policy domain specific expertise. The Lab created a <a href=\"https://berkeley.box.com/s/67ifo6hiv2axc5slaes1eno7yd7m8ri2\" target=\"_blank\" rel=\"noopener\">framework for people-centered abundance<\u002Fa>, and the Consortium proposed a policy agenda in line with it. <a href=\"#p4-s\">Twelve essentials<\u002Fa>, one central purpose for collaboration.<\u002Fp>\n          <div class=\"pull\"><a href=\"https://calmatters.org/sponsored/2026/02/economic-opportunity-public-good/\" target=\"_blank\" rel=\"noopener\">“There’s a role for everyone to play in the policy solutions described by these researchers — from students and parents, to teachers, workers, civil servants, and employers.”<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"step\" data-label=\"04 | The Approach\" data-labelcolor=\"#ffd587\" style=\"--ac:#ffd587\">\n          <div class=\"plate\">\n          <p class=\"num\">04 | The Approach<\u002Fp>\n          <h2><span class=\"refrain\">What happens when…<\u002Fspan>you center people?<\u002Fh2>\n          <p>Over the course of the Accelerator, we explored the contention that building more isn’t enough on its own. The people absorbing change need to trust that reform is worth supporting, and the people carrying it out need the resources to actually do the work we’ll need. People aren’t a constraint on abundance — they’re the mechanism that makes supply-side reform legitimate, viable, and durable.<\u002Fp>\n          <div class=\"pull\"><a href=\"https://calmatters.org/commentary/2025/04/abundance-agenda-more-than-efficiency/\" target=\"_blank\" rel=\"noopener\">“If we want a future of true abundance, we must start by investing in the people who will make it possible.”<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"step\" data-label=\"05 | The Portfolio\" data-labelcolor=\"#0e9899\" style=\"--ac:#5ec6c7\">\n          <div class=\"plate\">\n          <p class=\"num\">05 | The Portfolio<\u002Fp>\n          <h2><span class=\"refrain\">What happens when…<\u002Fspan>you forge a new path forward?<\u002Fh2>\n          <p>Since 2023, we have led a broad portfolio of work to move a people-centered framework for creating abundance forward. We hosted a <a href=\"https://possibilitylab.berkeley.edu/march-6-abundance-accelerator-summit-in-sacramento/\" target=\"_blank\" rel=\"noopener\">statewide Summit in Sacramento<\u002Fa> bringing our Consortium members directly into conversation with state officials. We completed a <a href=\"https://possibilitylab.berkeley.edu/project/housing-and-community-development-hcd-annual-progress-reports/\" target=\"_blank\" rel=\"noopener\">research partnership<\u002Fa> with the California Department of Housing and Community Development (HCD) to improve the state’s system for collecting housing production data from local governments. And we facilitated multiple projects focused on the role of communities, workers, and civil servants in the abundance agenda. This site offers a time capsule of the Abundance Accelerator and envisions a path forward.<\u002Fp>\n          <div class=\"pull\"><a href=\"https://calmatters.org/sponsored/2025/09/people-centered-policymaking/\" target=\"_blank\" rel=\"noopener\">“Without intentional action, new policies could simply reproduce existing inequalities at a larger scale. But done well, California’s push for reforms could become a model for how we meet people’s basic needs while expanding opportunity for everyone.”<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"step-tail\" aria-hidden=\"true\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PART TWO: THE AGENDA -->\n<section class=\"stack\" id=\"p2-s\" data-scene=\"\" aria-labelledby=\"p2\" data-screen-label=\"Part Two\">\n  <div class=\"part-mark\">\n    <p class=\"pl\">Part Two<\u002Fp>\n    <h2 class=\"pt\" id=\"p2\">The <em>Agenda<\u002Fem><\u002Fh2>\n    <p class=\"ps\">People-centered abundance isn’t a slogan. It’s a set of practices. Scroll the deck.<\u002Fp>\n    <div class=\"tick\"><\u002Fdiv>\n    <div class=\"view-toggle\" role=\"group\" aria-label=\"Deck view\"><button type=\"button\" data-view=\"deck\" aria-pressed=\"true\">Deck<\u002Fbutton><button type=\"button\" data-view=\"all\" aria-pressed=\"false\">All cards<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"deck-wrap pin-track\" id=\"deckTrack\" data-progress=\"pin\" style=\"--track:620vh\">\n    <div class=\"pin-stage\">\n      <div class=\"deck\" id=\"deck\">\n        <article class=\"scard dark\" style=\"--cardbg:#1b2f44\"><span class=\"big\" aria-hidden=\"true\">01<\u002Fspan><span class=\"sym\" aria-hidden=\"true\">✳<\u002Fspan><div><p class=\"kn\">01 | Set a Floor<\u002Fp><h3>Commit to shared abundance<\u002Fh3><p>People in different communities, families, and life stages will need different things, but for abundance to really be shared, the floor has to hold for everyone.<\u002Fp><\u002Fdiv><\u002Farticle>\n        <article class=\"scard dark\" style=\"--cardbg:#2e4d71\"><span class=\"big\" aria-hidden=\"true\">02<\u002Fspan><span class=\"sym\" aria-hidden=\"true\">✳<\u002Fspan><div><p class=\"kn\">02 | Mend the Trust Deficit<\u002Fp><h3>Build trust by building with people<\u002Fh3><p>The problem of scarcity is both material and relational. Building what people need and earning people’s trust are two sides of the same coin.<\u002Fp><\u002Fdiv><\u002Farticle>\n        <article class=\"scard light\" style=\"--cardbg:#f28277\"><span class=\"big\" aria-hidden=\"true\">03<\u002Fspan><span class=\"sym\" aria-hidden=\"true\">✳<\u002Fspan><div><p class=\"kn\">03 | Cultivate Buy-In<\u002Fp><h3>Create durability through shared benefits<\u002Fh3><p>Supply-side policy always asks something of people. Whether communities cooperate depends on what it gives back in return.<\u002Fp><\u002Fdiv><\u002Farticle>\n        <article class=\"scard light\" style=\"--cardbg:#ffd587\"><span class=\"big\" aria-hidden=\"true\">04<\u002Fspan><span class=\"sym\" aria-hidden=\"true\">✳<\u002Fspan><div><p class=\"kn\">04 | Restore Public Ambition<\u002Fp><h3>Enact reforms for institutional renewal<\u002Fh3><p>An abundance policy is only as good as its implementation. Abundance requires getting governance right.<\u002Fp><\u002Fdiv><\u002Farticle>\n        <article class=\"scard light\" style=\"--cardbg:#f2eadf\"><span class=\"big\" aria-hidden=\"true\">05<\u002Fspan><span class=\"sym\" aria-hidden=\"true\">✳<\u002Fspan><div><p class=\"kn\">05 | Strengthen Civic Infrastructure<\u002Fp><h3>Empower people closest to the problem<\u002Fh3><p>The lived expertise of people is a powerful resource. Abundance is possible if we find better ways to give communities, workers, and civil servants a meaningful voice in the goods and resources they need.<\u002Fp><\u002Fdiv><\u002Farticle>\n        <article class=\"scard dark\" style=\"--cardbg:#21384f\"><span class=\"big\" aria-hidden=\"true\">06<\u002Fspan><span class=\"sym\" aria-hidden=\"true\">✳<\u002Fspan><div><p class=\"kn\">06 | Build Resilience<\u002Fp><h3>Create the conditions for adaptive co-governance<\u002Fh3><p>Abundance is not a destination, but rather a practice of continuous collaboration between people inside and outside of government that allows residents to thrive.<\u002Fp><\u002Fdiv><\u002Farticle>\n      <\u002Fdiv>\n      <div class=\"deck-ui\" aria-hidden=\"true\">\n        <div class=\"counter\" id=\"deckCounter\">01 / 06<\u002Fdiv>\n        <div class=\"ticks\" id=\"deckTicks\"><i class=\"on\"><\u002Fi><i><\u002Fi><i><\u002Fi><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PART THREE: THE PARTNERSHIP -->\n<section class=\"partner\" id=\"p3-s\" data-scene=\"\" aria-labelledby=\"p3\" data-screen-label=\"Part Three\">\n  <div class=\"part-mark\">\n    <p class=\"pl\">Part Three<\u002Fp>\n    <h2 class=\"pt\" id=\"p3\">The <em>Partnership<\u002Fem><\u002Fh2>\n    <p class=\"ps\">People-Centered Policymaking in Housing Abundance<\u002Fp>\n    <div class=\"tick\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"wide-fig\" data-fx=\"fade-up\"><image-slot id=\"planners\" shape=\"rect\" placeholder=\"Photo: local planners at work — the people behind the APR\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"essay\">\n      <div class=\"prose\">\n        <p data-fx=\"fade-up\">For years, California has experienced a major housing shortage. This sustained scarcity has prompted a wave of state-level policy initiatives to increase housing production by requiring local jurisdictions to meet their fair share of California’s housing needs.<\u002Fp>\n        <p data-fx=\"fade-up\" data-fx-delay=\"1\">For this system to work, every local government must report annual housing production updates to the California Department of Housing and Community Development (HCD), so it can track local progress and continuously improve public policy toward housing abundance.<\u002Fp>\n        <p>But here’s the catch: before this reporting was mandated in 2006, local governments had no obligation under state law to keep a detailed record of their housing production pipelines across development milestones, such as entitlement and permitting, which are commonly overseen by different local departments altogether. Without any such obligation, many local governments did not develop the documentation and capacity necessary for comprehensive data collection on housing projects across the development lifecycle. And even since 2006, in part due to constantly changing requirements, many still have not fully developed this capability.<\u002Fp>\n        <p>For many local planners, the problem with this system for tracking housing progress is that it requires more output from them without providing the requisite resources. In 2025, we conducted a survey of the people who take on the time-intensive task of filling out the Annual Progress Report (APR) form, by which local governments report on every housing development in their jurisdiction’s pipeline — from the initial project application to the final certification that a new building is ready for tenants, as well as the planning and permitting approvals that take place in between. Lacking the requisite staffing to absorb these new responsibilities, many local planners told us they are <strong>regularly skipping lunch, working weekends, and putting other tasks on hold<\u002Fstrong> for several months each year to complete their city’s APR.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"question\" data-scene=\"\" aria-label=\"The question\" data-screen-label=\"Part Three — Question\">\n  <div class=\"pin-track\" data-progress=\"pin\" style=\"--track:240vh\">\n    <div class=\"pin-stage\">\n      <p class=\"q\" data-reveal=\"\">How might California’s system for accelerating and tracking housing progress look different if it were <em>co-designed with the people involved in its implementation?<\u002Fem><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"partner\" data-scene=\"\" aria-label=\"The partnership, continued\" data-screen-label=\"Part Three — Continued\" style=\"padding-top:40px\">\n  <div class=\"wrap\">\n    <div class=\"essay\" style=\"margin-top:0\">\n      <div class=\"prose\">\n        <p data-fx=\"fade-up\">From 2024 to 2026, the Possibility Lab partnered with HCD to hear from civil servants directly about how they collect, manage, and report local housing data, to help improve the feasibility of the APR form and process for local governments. Culminating in a set of recommendations to HCD, this research partnership offers a model for improving state-local coordination in the implementation of policy that aims to increase the supply of essentials like housing in California. Critically, in our view, it exemplifies the kind of public-sector problem solving at the heart of people-centered policymaking.<\u002Fp>\n        <!-- HCD Full Report button returns in November when the report is re-released: <a class=\"btn\" href=\"…\">HCD Full Report <span aria-hidden=\"true\">↗<\u002Fspan><\u002Fa> -->\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"gravity\">\n      <div class=\"orbit\" data-scene=\"\" aria-hidden=\"true\">\n        <svg viewBox=\"0 0 520 480\">\n          <g class=\"cin\" style=\"--dx:0;--dy:-120px\"><circle class=\"c f1\" cx=\"260\" cy=\"170\" r=\"150\" fill=\"#f28277\"><\u002Fcircle><\u002Fg>\n          <g class=\"cin\" style=\"--dx:-120px;--dy:70px\"><circle class=\"c f2\" cx=\"175\" cy=\"310\" r=\"150\" fill=\"#24a1bf\"><\u002Fcircle><\u002Fg>\n          <g class=\"cin\" style=\"--dx:120px;--dy:70px\"><circle class=\"c f3\" cx=\"345\" cy=\"310\" r=\"150\" fill=\"#ffd587\"><\u002Fcircle><\u002Fg>\n          <text class=\"lb\" x=\"260\" y=\"78\" text-anchor=\"middle\">Communities<\u002Ftext>\n          <text class=\"lb\" x=\"112\" y=\"420\" text-anchor=\"middle\">Workers<\u002Ftext>\n          <text class=\"lb\" x=\"408\" y=\"420\" text-anchor=\"middle\">Civil Servants<\u002Ftext>\n          <g class=\"hub\"><rect x=\"100\" y=\"247\" width=\"320\" height=\"34\" fill=\"#1b2f44\"><\u002Frect><text x=\"260\" y=\"269\" text-anchor=\"middle\">People-Centered Policymaking<\u002Ftext><\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"prose\">\n        <p>More broadly: throughout the Abundance Accelerator, the Possibility Lab’s research orbited around three centers of gravity: <strong>communities, workers, and civil servants<\u002Fstrong>. Each group is responsible for absorbing and creating new housing, but too often their lived and technical expertise is not productively harnessed by the policy process. As a reform approach, people-centered policymaking develops policy interventions by engaging with people. In the case of housing abundance and beyond, this means building better feedback loops that bring together communities, workers, and civil servants to cocreate and coordinate policy solutions, not just at their inception but through the full course of their implementation. Bringing people into the policy process doesn’t mean doing away with technical expertise; it means putting it in conversation with lived experience, so that policy reform is legitimate, viable, and durable.<\u002Fp>\n        <p>Our work on people-centered policymaking is only just beginning. Sign up for our <a href=\"https://possibilitylab.berkeley.edu/contact-us/\" target=\"_blank\" rel=\"noopener\">newsletter<\u002Fa> to follow along and be notified when we share findings from projects within this research agenda, including the forthcoming report from our research partnership with HCD. And in the meantime, check out what we’ve learned so far about the role of <a href=\"https://berkeley.box.com/s/qwgh3bj2n9ut573nsa1wxzpsgqm268yf\" target=\"_blank\" rel=\"noopener\">communities<\u002Fa> and <a href=\"workforce-housing-report.html\">workers<\u002Fa> in expanding the supply of housing and other essentials in California.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PART FOUR: THE CONSORTIUM POLICY AGENDA -->\n<section class=\"bank\" id=\"p4-s\" data-scene=\"\" aria-labelledby=\"p4\" data-screen-label=\"Part Four\">\n  <div class=\"wrap\">\n    <div class=\"bank-head\">\n      <div>\n        <p class=\"eyebrow\" data-fx=\"fade-up\">Part Four<\u002Fp>\n        <h2 id=\"p4\" data-fx=\"fade-up\" data-fx-delay=\"1\">The Abundance Consortium <em>Policy Agenda<\u002Fem><\u002Fh2>\n        <p class=\"lede\" data-fx=\"fade-up\" data-fx-delay=\"2\">We brought together 12 policy experts. These are their top recommendations for improving the accessibility and affordability of essentials in California.<\u002Fp>\n      <\u002Fdiv>\n      <svg class=\"ring\" id=\"ring\" viewBox=\"-90 -10 620 460\" role=\"img\" aria-label=\"Twelve interconnected essentials\"><\u002Fsvg>\n    <\u002Fdiv>\n\n    <div class=\"filters\" id=\"filters\" data-fx=\"fade-up\" data-fx-delay=\"3\" role=\"group\" aria-label=\"Filter by group\">\n      <button class=\"chip\" data-cat=\"all\" aria-pressed=\"true\">All<\u002Fbutton>\n      <button class=\"chip\" data-cat=\"built\" style=\"--c:#f28277\" aria-pressed=\"false\"><span class=\"dot\" aria-hidden=\"true\"><\u002Fspan>The Built Environment<\u002Fbutton>\n      <button class=\"chip\" data-cat=\"needs\" style=\"--c:#24a1bf\" aria-pressed=\"false\"><span class=\"dot\" aria-hidden=\"true\"><\u002Fspan>Basic Needs<\u002Fbutton>\n      <button class=\"chip\" data-cat=\"econ\" style=\"--c:#ffd587\" aria-pressed=\"false\"><span class=\"dot\" aria-hidden=\"true\"><\u002Fspan>Economic Opportunity<\u002Fbutton>\n      <button class=\"chip\" data-cat=\"care\" style=\"--c:#5ec6c7\" aria-pressed=\"false\"><span class=\"dot\" aria-hidden=\"true\"><\u002Fspan>The Care Economy<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"cards\" id=\"cards\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PART FIVE: THE HORIZON -->\n<section class=\"horizon\" id=\"p5-s\" data-scene=\"\" aria-labelledby=\"p5\" data-screen-label=\"Part Five\">\n  <div class=\"part-mark\">\n    <p class=\"pl\">Part Five<\u002Fp>\n    <h2 class=\"pt\" id=\"p5\">The <em>Horizon<\u002Fem><\u002Fh2>\n    <p class=\"ps\">From academic classrooms to civic festivals and beyond: Here’s where we’ve been and how we’re carrying the lessons forward.<\u002Fp>\n    <div class=\"tick\"><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"lead\" data-fx=\"fade-up\">Following our <a href=\"https://possibilitylab.berkeley.edu/march-6-abundance-accelerator-summit-in-sacramento/\" target=\"_blank\" rel=\"noopener\">2025 Abundance Summit in Sacramento<\u002Fa>, the Accelerator expanded its reach far and wide:<\u002Fp>\n  <div class=\"tl\" data-progress=\"view\">\n    <span class=\"tl-head\" aria-hidden=\"true\"><\u002Fspan>\n    <div class=\"tl-item\" data-scene=\"\" style=\"--ac:#0e9899\"><span class=\"dot\" aria-hidden=\"true\"><\u002Fspan><p>We developed and taught an original <strong>Abundance Curriculum<\u002Fstrong> to 20 local officials through the <a href=\"https://abundanceelected.com/fellowship/\" target=\"_blank\" rel=\"noopener\">Abundance Network Electeds Fellowship<\u002Fa> and 200+ undergraduate students through an Introduction to Public Policy field course at UC Berkeley.<\u002Fp><\u002Fdiv>\n    <div class=\"tl-item\" data-scene=\"\" style=\"--ac:#24a1bf\"><span class=\"dot\" aria-hidden=\"true\"><\u002Fspan><p>We launched the <a href=\"https://calmatters.org/sponsored/knowledge-hub/possibility-lab/\" target=\"_blank\" rel=\"noopener\"><strong>Knowledge Hub<\u002Fstrong> with CalMatters<\u002Fa>, where we published a series on people-centered policymaking that featured 12 memos by the Abundance Consortium and provided a view of abundance oriented around the people that the agenda is meant to support.<\u002Fp><\u002Fdiv>\n    <div class=\"tl-item\" data-scene=\"\" style=\"--ac:#f28277\"><span class=\"dot\" aria-hidden=\"true\"><\u002Fspan><p>We hosted two participatory workshops at the CalMatters Ideas Festival and the KQED Night of Ideas, where people played a roleplay game called <a href=\"https://mailchi.mp/berkeley/february-news-from-the-lab-10966161\" target=\"_blank\" rel=\"noopener\"><strong>The Possibility Zone<\u002Fstrong><\u002Fa>, in which they were each given a role in a hypothetical policy scenario and asked to deliberate policy tradeoffs to guide potential solutions from the perspective of their assigned roles.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"photo\">\n    <div class=\"fig\"><image-slot id=\"workshop\" shape=\"rect\" placeholder=\"Photo: a Possibility Zone workshop — people at a table, deliberating\"><\u002Fimage-slot><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"between\" data-fx=\"fade-up\">There is still much work to do. A single initiative can only kick the ball down the field so far. The next stage of research and practice requires broad implementation of the people-centered methodologies we’ve developed through the Accelerator and beyond, to bring both technical and lived expertise more fully into the policymaking process.<\u002Fp>\n  <p class=\"lead\" data-fx=\"fade-up\" style=\"margin-top:36px\">We’ve already begun honing these methodologies through a range of recent and ongoing initiatives:<\u002Fp>\n  <div class=\"tl\" data-progress=\"view\">\n    <span class=\"tl-head\" aria-hidden=\"true\"><\u002Fspan>\n    <div class=\"tl-item\" data-scene=\"\" style=\"--ac:#ffd587\"><span class=\"dot\" aria-hidden=\"true\"><\u002Fspan><p>We hosted an <strong>Engaging with Possibility Summit<\u002Fstrong> that brought together top California disruptors, gamechangers, and innovators interested in exploring effective ways to bridge the gap between government and community.<\u002Fp><\u002Fdiv>\n    <div class=\"tl-item\" data-scene=\"\" style=\"--ac:#0e9899\"><span class=\"dot\" aria-hidden=\"true\"><\u002Fspan><p>This event also served as the official kickoff to the Possibility Lab’s new <a href=\"https://possibilitylab.berkeley.edu/state-of-engagement-fellowship/\" target=\"_blank\" rel=\"noopener\"><strong>State of Engagement Fellowship<\u002Fstrong><\u002Fa>, which advances civic engagement by bringing together a peer learning cohort of mid-to-senior-level leaders in California state departments and agencies.<\u002Fp><\u002Fdiv>\n    <div class=\"tl-item\" data-scene=\"\" style=\"--ac:#24a1bf\"><span class=\"dot\" aria-hidden=\"true\"><\u002Fspan><p>We are launching a <strong>second phase of the Knowledge Hub<\u002Fstrong> with CalMatters, where the Lab will help curate a new public impact research series of relevance to California public policy.<\u002Fp><\u002Fdiv>\n    <div class=\"tl-item\" data-scene=\"\" style=\"--ac:#f28277\"><span class=\"dot\" aria-hidden=\"true\"><\u002Fspan><p>We are disseminating a <a href=\"https://possibilitylab.berkeley.edu/civic-engagement-agenda/\" target=\"_blank\" rel=\"noopener\"><strong>Civic Engagement Agenda for California’s Next Governor<\u002Fstrong><\u002Fa>, where we propose a suite of policy strategies for improving civic health and increasing the responsiveness of public policies to community needs.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- LEGACY -->\n<section class=\"close\" data-scene=\"\" aria-label=\"Legacy\" data-screen-label=\"Legacy\">\n  <div class=\"glow\" aria-hidden=\"true\"><\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"legacy\">\n      <div class=\"stay\">\n        <p class=\"big\" data-fx=\"fade-up\" data-fx-delay=\"1\">The impact of the Abundance Accelerator will extend <em>well beyond the life of the initiative itself.<\u002Fem><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"prose\">\n        <p data-fx=\"fade-up\" data-fx-delay=\"2\">The work undertaken over the past three years has generated a body of knowledge, relationships, and institutional capacity that is already translating into meaningful and tangible impacts across California.<\u002Fp>\n        <p>Our <a href=\"https://possibilitylab.berkeley.edu/state-of-engagement-fellowship/\" target=\"_blank\" rel=\"noopener\">State of Engagement Fellows<\u002Fa> are carrying the lessons and practices developed through this work into their own institutions, applying them to strengthen the relationship between government and community. The work of the Abundance Policy Research Consortium is becoming embedded in the research agendas and future policy recommendations of participating labs and centers. The elected officials who participated in our trainings are bringing a people-centered approach to governance back to their local communities. These are only a few examples of how the work is already extending beyond the initiative itself.<\u002Fp>\n        <p>Perhaps the most consequential legacy of the Abundance Accelerator, however, will be what comes next. Over the past three years, we have accumulated not only research and practical lessons, but also a deeper understanding of what it takes to make policymaking more responsive, participatory, and grounded in the lived experiences of Californians. We have brought those insights together in our new <a href=\"https://possibilitylab.berkeley.edu/civic-engagement-agenda/\" target=\"_blank\" rel=\"noopener\">Civic Engagement Agenda for California’s Next Governor<\u002Fa>.<\u002Fp>\n        <p>The agenda represents an important synthesis of what we have learned about people-centered policymaking. It identifies concrete actions a new administration can take to strengthen civic trust, improve public participation, and create more meaningful connections between Californians and the institutions that govern them. Implementation is where the enduring impact of this work will ultimately be measured. The recommendations we advance, the institutional practices they inform, and the relationships they help shape will determine how much of what began through the Abundance Accelerator becomes part of the broader practice of governance in California.<\u002Fp>\n        <p class=\"final\">In that sense, the true legacy of the Accelerator may be less about any single initiative or deliverable and more about the capacity it has helped build for a different kind of policymaking: <em>one that treats communities not simply as recipients of government, but as essential participants in shaping it.<\u002Fem><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"thanks\" data-fx=\"fade-up\">\n      <div class=\"logo\"><p class=\"eyebrow\">With thanks<\u002Fp><div class=\"slot\"><img src=\"5a37c47d-3d7b-44df-9187-401d930e7c8f\" alt=\"California Community Foundation\"><\u002Fdiv><\u002Fdiv>\n      <p>Thank you to the California Community Foundation for supporting us throughout this journey and for investing in this project, and for the many state, local, and community partners who participated in this ambitious work. Your support and engagement has contributed meaningfully to the growing knowledge base around people-centered policymaking and the work of rebuilding trust in government. More importantly, it has created a foundation for that work to continue, evolve, and influence public institutions and people’s lives for years to come.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"foot\">\n      <span>Possibility Lab · Goldman School of Public Policy, UC Berkeley<\u002Fspan>\n      <span>Abundance Accelerator · 2023–2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<button class=\"motion-toggle\" data-motion-toggle=\"\" aria-pressed=\"true\">Motion: on<\u002Fbutton>\n\n<script>\n/* Scrolly engine */\n(() => {\n  'use strict';\n  const html = document.documentElement;\n  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');\n  let noMotion = mq.matches, raf = 0;\n  const tracked = new Set();\n  const clamp = (v) => Math.max(0, Math.min(1, v));\n  const apply = (el, v) => {\n    el.style.setProperty('--progress', v.toFixed(4));\n    const segs = parseInt(el.dataset.segments || '0', 10);\n    if (segs > 0) { const seg = Math.min(segs - 1, Math.floor(v * segs)); if (el.dataset.seg !== String(seg)) el.dataset.seg = String(seg); }\n    if (el._onProgress) el._onProgress(v);\n  };\n  const progressOf = (el) => {\n    const r = el.getBoundingClientRect(), vh = window.innerHeight;\n    if (el.dataset.progress === 'pin') { const total = r.height - vh; return total > 0 ? clamp(-r.top / total) : 0; }\n    return clamp((vh - r.top) / (vh + r.height));\n  };\n  const loop = () => {\n    raf = 0; if (noMotion) return; let any = false;\n    tracked.forEach((el) => { const r = el.getBoundingClientRect(); if (r.bottom > 0 && r.top < window.innerHeight) { apply(el, progressOf(el)); any = true; } });\n    if (any) raf = requestAnimationFrame(loop);\n  };\n  const kick = () => { if (!raf && !noMotion) raf = requestAnimationFrame(loop); };\n  const gateIO = new IntersectionObserver((entries) => {\n    entries.forEach((e) => { if (e.isIntersecting) { tracked.add(e.target); kick(); } else { tracked.delete(e.target); apply(e.target, progressOf(e.target)); } });\n  });\n  document.querySelectorAll('[data-progress]').forEach((el) => gateIO.observe(el));\n  addEventListener('scroll', kick, { passive: true });\n  addEventListener('resize', kick, { passive: true });\n  const sceneIO = new IntersectionObserver((entries) => {\n    entries.forEach((e) => { if (e.isIntersecting) e.target.classList.add('is-active', 'has-played'); else e.target.classList.remove('is-active'); });\n  }, { rootMargin: '-12% 0px -12% 0px' });\n  document.querySelectorAll('[data-scene]').forEach((el) => sceneIO.observe(el));\n  const finishAll = () => {\n    document.querySelectorAll('[data-scene]').forEach((el) => el.classList.add('is-active', 'has-played'));\n    document.querySelectorAll('[data-progress]').forEach((el) => apply(el, 1));\n  };\n  const setMotion = (off) => {\n    noMotion = off; html.classList.toggle('no-motion', off);\n    document.querySelectorAll('[data-motion-toggle]').forEach((b) => { b.setAttribute('aria-pressed', String(!off)); b.textContent = off ? 'Motion: off' : 'Motion: on'; });\n    if (off) finishAll(); else if (tracked.size && !raf) loop();\n  };\n  document.querySelectorAll('[data-motion-toggle]').forEach((b) => b.addEventListener('click', () => setMotion(!noMotion)));\n  mq.addEventListener('change', (e) => { if (e.matches) setMotion(true); });\n  if (noMotion) setMotion(true);\n  window.ScrollyKit = { setMotion, finishAll };\n\n  /* ribbon: current part */\n  const navLinks = [...document.querySelectorAll('#partNav a')];\n  const parts = navLinks.map((a) => document.querySelector(a.getAttribute('href')));\n  const updNav = () => {\n    let cur = -1;\n    parts.forEach((p, i) => { if (p && p.getBoundingClientRect().top <= innerHeight * 0.5) cur = i; });\n    navLinks.forEach((a, i) => a.classList.toggle('on', i === cur));\n  };\n  addEventListener('scroll', () => requestAnimationFrame(updNav), { passive: true });\n  updNav();\n})();\n<\u002Fscript>\n\n<script>\n/* Story modules */\n(() => {\n  'use strict';\n  const reduceNow = () => document.documentElement.classList.contains('no-motion');\n  const sm = (a, b, t) => { const x = Math.max(0, Math.min(1, (t - a) / (b - a))); return x * x * (3 - 2 * x); };\n\n  /* hero */\n  const heroTrack = document.getElementById('heroTrack');\n  if (heroTrack) {\n    const art = document.getElementById('heroArt'), fade = document.getElementById('heroFade'), cue = document.getElementById('heroCue');\n    const copy = heroTrack.querySelector('.wrap');\n    heroTrack._onProgress = (v) => {\n      if (reduceNow()) { if (art) art.style.transform = ''; if (fade) fade.style.setProperty('--fade', 0); if (cue) cue.style.opacity = ''; if (copy) { copy.style.opacity = ''; copy.style.transform = ''; } return; }\n      if (art) art.style.transform = 'translateY(' + (v * -6).toFixed(2) + '%) scale(' + (1.04 + v * 0.16).toFixed(3) + ')';\n      const lift = sm(0.42, 0.78, v);\n      if (copy) { copy.style.opacity = (1 - lift).toFixed(2); copy.style.transform = 'translateY(' + (lift * -44).toFixed(1) + 'px)'; }\n      if (fade) fade.style.setProperty('--fade', sm(0.6, 0.96, v).toFixed(3));\n      if (cue) cue.style.opacity = (0.85 * (1 - sm(0.12, 0.3, v))).toFixed(2);\n    };\n    heroTrack._onProgress(0);\n  }\n\n  /* essentials: 12 dots -> 3 rings sweep in and connect -> 1 central focus */\n  const ess = document.getElementById('essField'), essTrack = document.getElementById('essTrack');\n  if (ess && essTrack) {\n    const ctx = ess.getContext('2d');\n    const NAMES = ['Housing', 'Transportation', 'Energy', 'Water', 'Food', 'Safety', 'Education', 'Employment', 'Digital Connectivity', 'Childcare', 'Healthcare', 'Eldercare'];\n    const GC = ['#f28277', '#f28277', '#f28277', '#24a1bf', '#24a1bf', '#24a1bf', '#ffd587', '#ffd587', '#ffd587', '#5ec6c7', '#5ec6c7', '#5ec6c7'];\n    let W = 0, H = 0, target = 0, shown = 0, running = 0, visible = false, spin = 0, last = 0;\n    const sm = (a, b, t) => { const x = Math.max(0, Math.min(1, (t - a) / (b - a))); return x * x * (3 - 2 * x); };\n    const lerp = (a, b, t) => a + (b - a) * t;\n    const setup = () => { const DPR = Math.min(devicePixelRatio || 1, 2); const r = ess.getBoundingClientRect(); W = r.width; H = r.height; ess.width = W * DPR; ess.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); };\n    const person = (x, y, s, col, al) => { ctx.globalAlpha = al; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y - 4 * s, 3.3 * s, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.roundRect(x - 4 * s, y + 1 * s, 8 * s, 10 * s, 3 * s); ctx.fill(); };\n    const frame = (t, tm) => {\n      ctx.clearRect(0, 0, W, H);\n      const a1 = sm(0, 0.2, t), a2 = sm(0.34, 0.56, t), a3 = sm(0.7, 0.92, t);\n      const small = W < 700, Rr = Math.min(W * (small ? 0.34 : 0.28), H * (small ? 0.3 : 0.28)), cx = W / 2, cy = H * 0.44;\n      if (tm != null) { spin += (tm - last) * (0.05 + a2 * 0.12 - a3 * 0.1); last = tm; }\n      const pos = [];\n      for (let i = 0; i < 12; i++) {\n        const a0 = -Math.PI / 2 + i * Math.PI / 6;\n        const ringR = Rr * (0.56 + 0.22 * (i % 3));\n        const ang = a0 + spin * (1 + (i % 3) * 0.35);\n        let x = lerp(cx + Math.cos(a0) * Rr, cx + Math.cos(ang) * ringR, a2), y = lerp(cy + Math.sin(a0) * Rr, cy + Math.sin(ang) * ringR, a2);\n        const ang3 = a0 + spin * 1.6; x = lerp(x, cx + Math.cos(ang3) * Rr * 0.3, a3); y = lerp(y, cy + Math.sin(ang3) * Rr * 0.3, a3);\n        const pop = sm(i / 12 * 0.8, i / 12 * 0.8 + 0.2, a1);\n        pos.push({ x, y, pop, a0 });\n      }\n      /* three rings sweep in like years */\n      for (let k = 0; k < 3; k++) {\n        const sweep = sm(k * 0.25, k * 0.25 + 0.5, a2);\n        if (sweep <= 0) continue;\n        ctx.globalAlpha = 0.5 * (1 - a3) * Math.min(1, sweep * 2); ctx.strokeStyle = k === 0 ? '#0e9899' : k === 1 ? '#24a1bf' : '#ffd587'; ctx.lineWidth = 1.2;\n        ctx.beginPath(); ctx.arc(cx, cy, Rr * (0.56 + 0.22 * k), -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * sweep); ctx.stroke();\n      }\n      /* chords: essentials are interconnected */\n      const la = a2 * (1 - a3) * 0.35;\n      if (la > 0.005) { ctx.globalAlpha = la; ctx.strokeStyle = '#f2eadf'; ctx.lineWidth = 0.8; ctx.beginPath(); for (let i = 0; i < 12; i++) { for (const k of [4, 5, 7]) { const j = (i + k) % 12; if (j < i) continue; ctx.moveTo(pos[i].x, pos[i].y); ctx.quadraticCurveTo(cx, cy, pos[j].x, pos[j].y); } } ctx.stroke(); }\n      /* spokes pull in to the center */\n      if (a3 > 0.01) { ctx.globalAlpha = a3 * 0.4; ctx.strokeStyle = '#ffd587'; ctx.lineWidth = 1; ctx.beginPath(); pos.forEach((p) => { ctx.moveTo(cx, cy); ctx.lineTo(p.x, p.y); }); ctx.stroke(); }\n      /* the twelve */\n      ctx.textBaseline = 'middle'; ctx.font = '600 ' + (small ? 10 : 12) + 'px \"Libre Franklin\", system-ui, sans-serif';\n      pos.forEach((p, i) => {\n        if (p.pop <= 0.01) return;\n        const r = (small ? 5 : 6.5) * p.pop * (1 + a3 * 0.2) + (tm != null ? Math.sin(tm * 2 + i) * 0.6 * a2 : 0);\n        ctx.globalAlpha = p.pop; ctx.fillStyle = GC[i]; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();\n        const la2 = p.pop * (1 - a2);\n        if (la2 > 0.02) {\n          const lx = cx + Math.cos(p.a0) * (Rr + (small ? 16 : 22)), ly = cy + Math.sin(p.a0) * (Rr + (small ? 16 : 22));\n          ctx.globalAlpha = la2; ctx.fillStyle = '#f2eadf';\n          ctx.textAlign = Math.abs(Math.cos(p.a0)) < 0.2 ? 'center' : Math.cos(p.a0) > 0 ? 'left' : 'right';\n          ctx.fillText(NAMES[i].toUpperCase().split('').join(String.fromCharCode(8202)), lx, ly);\n        }\n      });\n      /* one central focus */\n      if (a3 > 0.01) {\n        if (tm != null) for (let k = 0; k < 3; k++) { const ph = (tm * 0.4 + k / 3) % 1; ctx.globalAlpha = a3 * (1 - ph) * 0.5; ctx.strokeStyle = '#ffd587'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, Rr * (0.12 + ph * 0.5), 0, Math.PI * 2); ctx.stroke(); }\n        ctx.globalAlpha = a3; ctx.beginPath(); ctx.arc(cx, cy, Rr * 0.14 * a3, 0, Math.PI * 2); ctx.fillStyle = '#2e4d71'; ctx.fill(); ctx.strokeStyle = '#ffd587'; ctx.lineWidth = 1; ctx.stroke();\n        person(cx, cy, 1.6 * a3, '#ffd587', a3);\n      }\n      ctx.globalAlpha = 1;\n    };\n    const animate = () => { running = 0; if (reduceNow()) { frame(1, null); return; } shown += (target - shown) * 0.1; frame(shown, performance.now() / 1000); if (visible) running = requestAnimationFrame(animate); };\n    const kick = () => { if (!running) { last = performance.now() / 1000; running = requestAnimationFrame(animate); } };\n    essTrack._onProgress = (v) => { target = Math.max(0, Math.min(1, (v - 0.04) / 0.9)); if (reduceNow()) { setup(); frame(1, null); } else kick(); };\n    new IntersectionObserver((es) => { es.forEach((e) => { visible = e.isIntersecting; if (visible) kick(); }); }).observe(ess);\n    setup(); frame(0, null);\n    addEventListener('resize', () => { setup(); frame(reduceNow() ? 1 : shown, null); });\n    document.fonts && document.fonts.ready.then(() => frame(shown, null));\n  }\n\n  /* word-by-word scroll reveal (opening paragraph, the housing question) */\n  document.querySelectorAll('[data-reveal]').forEach((p) => {\n    const words = [];\n    const walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT); const nodes = [];\n    while (walker.nextNode()) nodes.push(walker.currentNode);\n    nodes.forEach((node) => {\n      const frag = document.createDocumentFragment();\n      node.nodeValue.split(/(\\s+)/).forEach((piece) => {\n        if (!piece) return;\n        if (/^\\s+$/.test(piece)) frag.append(document.createTextNode(piece));\n        else { const w = document.createElement('span'); w.className = 'rw'; w.textContent = piece; frag.append(w); words.push(w); }\n      });\n      node.replaceWith(frag);\n    });\n    const track = p.closest('.pin-track'); if (!track) return;\n    const clamp = (n) => Math.max(0, Math.min(1, n));\n    track._onProgress = (v) => {\n      if (reduceNow()) { words.forEach((w) => w.style.opacity = ''); return; }\n      const rev = clamp((v - 0.04) / 0.84) * (words.length + 3);\n      words.forEach((w, i) => { const a = clamp((rev - i) / 3); w.style.opacity = (0.14 + 0.86 * a * a * (3 - 2 * a)).toFixed(3); });\n    };\n    track._onProgress(0);\n  });\n\n  /* page progress */\n  const pageBar = document.getElementById('pageBar');\n  if (pageBar) {\n    let praf = 0;\n    const upd = () => { praf = 0; const max = document.documentElement.scrollHeight - innerHeight; pageBar.style.setProperty('--page', (max > 0 ? scrollY / max : 0).toFixed(4)); };\n    addEventListener('scroll', () => { if (!praf) praf = requestAnimationFrame(upd); }, { passive: true });\n    upd();\n  }\n\n  /* people orbit: 01 a grid of capacity -> 02 some go missing -> 03 gather into orbit, connect -> 04 become people, a person at the center -> 05 the orbit keeps turning */\n  const cv = document.getElementById('dotfield'), stepsCol = document.getElementById('steps');\n  if (cv && stepsCol) {\n    const ctx = cv.getContext('2d');\n    const COLS = ['#ffd587', '#f28277', '#0e9899', '#24a1bf'];\n    const K = { start: 0.05, span: 0.78, follow: 0.09, assemble: [0, 0.08], holes: [0.18, 0.32], orbit: [0.40, 0.54], people: [0.62, 0.76], turn: [0.86, 1] };\n    const N = 84;\n    let W = 0, H = 0, pts = [], target = 0, shown = 0, running = 0, visible = false, spin = 0, last = 0;\n    const lerp = (x, y, t) => x + (y - x) * t;\n    const smooth = (r, t) => { const x = Math.max(0, Math.min(1, (t - r[0]) / (r[1] - r[0]))); return x * x * (3 - 2 * x); };\n    const setup = () => {\n      const DPR = Math.min(devicePixelRatio || 1, 2);\n      const r = cv.getBoundingClientRect(); W = r.width; H = r.height;\n      cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n      const cols = Math.ceil(Math.sqrt(N * (W / H))), rows = Math.ceil(N / cols);\n      const gx = W / (cols + 1), gy = H / (rows + 1);\n      pts = [];\n      for (let i = 0; i < N; i++) {\n        pts.push({ gx: gx * (i % cols + 1), gy: gy * (Math.floor(i / cols) + 1), a: i * 2.39996, r: Math.sqrt((i + 1) / N), missing: i % 5 === 2, c: COLS[Math.floor(i / (N / 4))], ph: (i * 1.7) % (Math.PI * 2) });\n      }\n    };\n    const person = (x, y, s, col, al) => {\n      ctx.globalAlpha = al; ctx.fillStyle = col;\n      ctx.beginPath(); ctx.arc(x, y - 4 * s, 3.3 * s, 0, Math.PI * 2); ctx.fill();\n      ctx.beginPath(); ctx.roundRect(x - 4 * s, y + 1 * s, 8 * s, 10 * s, 3 * s); ctx.fill();\n    };\n    const frame = (t, tm) => {\n      ctx.clearRect(0, 0, W, H);\n      const a1 = smooth(K.assemble, t), a2 = smooth(K.holes, t), a3 = smooth(K.orbit, t), a4 = smooth(K.people, t), a5 = smooth(K.turn, t);\n      const radius = Math.min(W * .37, H * .32), cx = W * .5, cy = H * .48;\n      if (tm != null) { spin += (tm - last) * (0.04 + a3 * 0.06 + a5 * 0.08); last = tm; }\n      /* rings */\n      if (a3 > 0.01) {\n        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,' + (0.085 * a3).toFixed(3) + ')';\n        for (let k = 1; k <= 3; k++) { ctx.beginPath(); ctx.arc(cx, cy, radius * k / 3, 0, Math.PI * 2); ctx.stroke(); }\n      }\n      const pos = pts.map((p) => {\n        const ang = p.a + spin, rr = p.r * radius;\n        let x = lerp(p.gx, cx + Math.cos(ang) * rr, a3), y = lerp(p.gy, cy + Math.sin(ang) * rr, a3);\n        if (tm != null) { y += Math.sin(tm * 0.7 + p.ph) * 1.2 * (1 - a3); }\n        let al = 0.92 * a1;\n        if (p.missing) { al *= (1 - a2); al = Math.max(al, 0.9 * a3); }\n        else al *= (1 - a2 * 0.4 * (1 - a3));\n        al = lerp(al, 0.95, a4);\n        return { x, y, al };\n      });\n      /* links */\n      const la = 0.1 * a3 + 0.25 * a5;\n      if (la > 0.005) {\n        ctx.lineWidth = 1;\n        for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {\n          if (pos[i].al < 0.02 || pos[j].al < 0.02) continue;\n          const d = Math.hypot(pos[i].x - pos[j].x, pos[i].y - pos[j].y);\n          if (d < radius * .4) { ctx.strokeStyle = 'rgba(255,213,135,' + ((1 - d / (radius * .4)) * la).toFixed(3) + ')'; ctx.beginPath(); ctx.moveTo(pos[i].x, pos[i].y); ctx.lineTo(pos[j].x, pos[j].y); ctx.stroke(); }\n        }\n      }\n      /* the gap: dashed coral outlines where people are missing */\n      const gap = a2 * (1 - a3);\n      if (gap > 0.01) {\n        ctx.setLineDash([3, 4]); ctx.lineWidth = 1.5; ctx.strokeStyle = '#f28277';\n        for (let i = 0; i < N; i++) {\n          const p = pts[i]; if (!p.missing) continue;\n          const q = pos[i], pulse = tm != null ? 0.5 + 0.5 * Math.sin(tm * 2.4 + p.ph) : 1;\n          ctx.globalAlpha = gap * (0.55 + 0.45 * pulse); ctx.beginPath(); ctx.arc(q.x, q.y, 7 + 3 * pulse * gap, 0, Math.PI * 2); ctx.stroke();\n        }\n        ctx.setLineDash([]);\n      }\n      /* dots -> people */\n      for (let i = 0; i < N; i++) {\n        const p = pts[i], q = pos[i]; if (q.al < 0.01) continue;\n        const col = p.missing && a2 > 0 ? '#f28277' : (a3 > 0 ? p.c : '#f2eadf');\n        const dotR = (i % 6 === 0 ? 6 : 3.4) * (1 - a4) + 0.01;\n        if (a4 < 1) { ctx.globalAlpha = q.al * (1 - a4); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(q.x, q.y, dotR, 0, Math.PI * 2); ctx.fill(); }\n        const bob = tm != null ? Math.sin(tm * 2.2 + p.ph) * 2.5 * a5 : 0;\n        if (a4 > 0) person(q.x, q.y + bob, 0.6 + 0.4 * a4 + 0.15 * a5, col, q.al * a4);\n      }\n      /* the portfolio: ideas ripple outward from the center and travel the links */\n      if (a5 > 0.01 && tm != null) {\n        for (let k = 0; k < 3; k++) {\n          const ph = ((tm * 0.45 + k / 3) % 1);\n          ctx.globalAlpha = a5 * (1 - ph) * 0.55; ctx.strokeStyle = '#ffd587'; ctx.lineWidth = 1.5;\n          ctx.beginPath(); ctx.arc(cx, cy, radius * (0.23 + ph * 0.95), 0, Math.PI * 2); ctx.stroke();\n        }\n        ctx.setLineDash([3, 9]); ctx.lineDashOffset = -tm * 40; ctx.globalAlpha = a5 * 0.5; ctx.strokeStyle = '#f2eadf'; ctx.lineWidth = 1;\n        ctx.beginPath(); ctx.arc(cx, cy, radius * 1.08, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);\n        for (let k = 0; k < 10; k++) {\n          const i = (k * 11) % N, j = (k * 17 + 5) % N, u = (tm * 0.35 + k * 0.1) % 1;\n          if (pos[i].al < 0.02 || pos[j].al < 0.02) continue;\n          const x = lerp(pos[i].x, pos[j].x, u), y = lerp(pos[i].y, pos[j].y, u);\n          ctx.globalAlpha = a5 * Math.sin(u * Math.PI); ctx.fillStyle = '#ffd587';\n          ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill();\n        }\n      }\n      /* the person at the center */\n      if (a4 > 0.01) {\n        ctx.globalAlpha = a4; ctx.beginPath(); ctx.arc(cx, cy, radius * .23 * a4, 0, Math.PI * 2);\n        ctx.fillStyle = '#2e4d71'; ctx.fill(); ctx.strokeStyle = '#ffd587'; ctx.lineWidth = 1; ctx.stroke();\n        ctx.fillStyle = '#ffd587'; const s = a4;\n        ctx.beginPath(); ctx.arc(cx, cy - 10 * s, 8 * s, 0, Math.PI * 2); ctx.fill();\n        ctx.beginPath(); ctx.roundRect(cx - 12 * s, cy + 3 * s, 24 * s, 22 * s, 8 * s); ctx.fill();\n      }\n      ctx.globalAlpha = 1;\n    };\n    const animate = () => { running = 0; if (reduceNow()) { frame(target, null); return; } shown += (target - shown) * K.follow; frame(shown, performance.now() / 1000); if (visible) running = requestAnimationFrame(animate); };\n    const kick = () => { if (!running) { last = performance.now() / 1000; running = requestAnimationFrame(animate); } };\n    const stepEls = [...document.querySelectorAll('#steps .step')];\n    const vizLab = document.getElementById('vizLabel');\n    let curStep = -2;\n    const updateSteps = () => {\n      const mid = innerHeight * (innerWidth <= 820 ? 0.72 : 0.5);\n      let best = -1, bestDist = Infinity;\n      stepEls.forEach((el, i) => { const r = el.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return; const d = Math.abs((r.top + r.bottom) / 2 - mid); if (d < bestDist) { bestDist = d; best = i; } });\n      if (best === curStep) return;\n      curStep = best;\n      stepEls.forEach((el, i) => el.classList.toggle('is-step-active', i === best));\n      const el = stepEls[best];\n      if (el && vizLab && el.dataset.label) { vizLab.textContent = el.dataset.label; vizLab.style.color = el.dataset.labelcolor || ''; }\n    };\n    stepsCol._onProgress = (v) => {\n      target = Math.max(0, Math.min(1, (v - K.start) / K.span));\n      if (reduceNow()) { const r = cv.getBoundingClientRect(); if (Math.abs(r.width - W) > 1 || Math.abs(r.height - H) > 1) setup(); shown = target; frame(target, null); } else kick();\n      updateSteps();\n    };\n    const vizIO = new IntersectionObserver((es) => { es.forEach((e) => { visible = e.isIntersecting; if (visible) kick(); }); });\n    vizIO.observe(cv);\n    setup(); frame(0, null);\n    addEventListener('resize', () => { setup(); frame(reduceNow() ? target : shown, null); });\n    addEventListener('scroll', () => requestAnimationFrame(updateSteps), { passive: true });\n    updateSteps();\n  }\n\n  /* deck */\n  const track = document.getElementById('deckTrack');\n  const deckCards = track ? [...track.querySelectorAll('.scard')] : [];\n  if (track && deckCards.length) {\n    const n = deckCards.length, counter = document.getElementById('deckCounter'), ticks = [...document.querySelectorAll('#deckTicks i')];\n    const stackEl = track.closest('.stack');\n    const layout = (prog) => {\n      if (reduceNow() || (stackEl && stackEl.classList.contains('show-all'))) return;\n      const p = prog * (n - 1);\n      deckCards.forEach((card, i) => {\n        const rel = i - p; let ty, sc, op, z, rot = 0;\n        if (rel >= 0) { const k = Math.min(rel, 4); ty = k * 16; sc = 1 - k * 0.05; op = rel <= 3 ? Math.max(0, 1 - rel * 0.16) : 0; z = 200 - Math.round(rel * 10); }\n        else { ty = rel * 140; sc = 1 + Math.min(-rel, 1) * 0.04; op = Math.max(0, 1 + rel * 1.2); z = 300 + Math.round(-rel * 10); rot = Math.max(rel, -1) * -2.2; }\n        card.style.transform = 'translateY(' + ty.toFixed(1) + 'px) scale(' + sc.toFixed(3) + ') rotate(' + rot.toFixed(2) + 'deg)';\n        card.style.opacity = op.toFixed(2); card.style.zIndex = z;\n      });\n      const cur = Math.max(1, Math.min(n, Math.round(p) + 1));\n      if (counter) counter.textContent = String(cur).padStart(2, '0') + ' / ' + String(n).padStart(2, '0');\n      ticks.forEach((el, i) => el.classList.toggle('on', i < cur));\n    };\n    track._onProgress = layout; layout(0);\n    /* click a card to advance the deck (click the top card again at the end to go back to the first) */\n    let deckProg = 0;\n    const layoutHook = layout; track._onProgress = (v) => { deckProg = v; layoutHook(v); };\n    const goTo = (i) => { const total = track.getBoundingClientRect().height - innerHeight; const top = track.getBoundingClientRect().top + scrollY; window.scrollTo({ top: top + total * (i / (n - 1)) + 2, behavior: reduceNow() ? 'auto' : 'smooth' }); };\n    deckCards.forEach((card) => card.addEventListener('click', (e) => { if (e.target.closest('a') || (stackEl && stackEl.classList.contains('show-all'))) return; const cur = Math.round(deckProg * (n - 1)); goTo(cur >= n - 1 ? 0 : cur + 1); }));\n    deckCards.forEach((card) => { card.setAttribute('tabindex', '0'); card.setAttribute('role', 'button'); card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); } }); });\n    /* deck / all-cards toggle */\n    const toggle = stackEl && stackEl.querySelector('.view-toggle');\n    if (toggle) toggle.addEventListener('click', (e) => {\n      const b = e.target.closest('button[data-view]'); if (!b) return;\n      const all = b.dataset.view === 'all';\n      const anchor = stackEl.querySelector('.part-mark').getBoundingClientRect().top + scrollY;\n      stackEl.classList.toggle('show-all', all);\n      toggle.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));\n      deckCards.forEach((c) => { if (all) { c.style.transform = ''; c.style.opacity = ''; c.style.zIndex = ''; } });\n      if (!all) layout(deckProg);\n      window.scrollTo({ top: anchor - 10, behavior: 'auto' });\n    });\n  }\n})();\n<\u002Fscript>\n\n<script>\n/* Part Four: the Consortium agenda — ring + cards + filter */\n(() => {\n  'use strict';\n  const GROUPS = { built: { c: '#f28277', n: 'The Built Environment' }, needs: { c: '#24a1bf', n: 'Basic Needs' }, econ: { c: '#ffd587', n: 'Economic Opportunity' }, care: { c: '#5ec6c7', n: 'The Care Economy' } };\n  const DATA = [\n    { g: 'built', e: 'Housing', sheet: 'https://berkeley.box.com/s/cqzoevglmbjbst7zxbhnjtdn1ehczt2y', prof: 'https://luskin.ucla.edu/profile/paavo-monkkonen/', r: 'Implement a state-level zoning ordinance, building code, and permitting system in all neighborhoods that would allow multifamily buildings with high-floorplan efficiency to be quickly permitted as of right with minimal impact fees.', who: 'Paavo Monkkonen', aff: 'UCLA Luskin School of Public Affairs' },\n    { g: 'built', e: 'Transportation', sheet: 'https://berkeley.box.com/s/huqhm8ayrf1qyxt0yh5qef6ab4blv15j', prof: 'https://luskin.ucla.edu/profile/juan-matute/', r: 'Direct state transportation dollars toward infrastructure and programs that improve people’s access to their needs.', who: 'Juan Matute', aff: 'UCLA Institute of Transportation Studies' },\n    { g: 'built', e: 'Energy', sheet: 'https://berkeley.box.com/s/xrubis6n3mgsib437snbsa4p20bf6fsh', prof: 'https://humanecology.ucdavis.edu/people/keith-taylor', r: 'Adopt comprehensive energy and economic development policies that extend financial incentives to demand-facing institutions (CCAs, co-ops, municipalities, POUs) on parity with their investor-owned counterparts, ensuring they can build community wealth and resilience through institutions that prioritize the public interest.', who: 'Keith Taylor', aff: 'UC Davis Department of Human Ecology' },\n    { g: 'needs', e: 'Water', sheet: 'https://berkeley.box.com/s/6ef8g327261mzgam4p366trh3fi54if0', prof: 'https://faculty.sites.uci.edu/ulibarri/people/', r: 'Establish and enforce statewide minimum thresholds for Groundwater Sustainability Agencies that ensure the protection of domestic wells.', who: 'Nícola Ulibarrí', aff: 'UC Irvine Department of Urban Planning and Public Policy' },\n    { g: 'needs', e: 'Food', sheet: 'https://berkeley.box.com/s/p9qxj8ylmd0lro554m8lrtv4x7uurjw9', prof: 'https://nres.calpoly.edu/anastasia-telesetsky', r: 'Design, pilot, and scale community kitchens that facilitate the communal sharing of affordable, nutritious, and regionally-sourced food as a basis for restoring healthy community interactions.', who: 'Anastasia Telesetsky', aff: 'Cal Poly State University, San Luis Obispo Department of Natural Resources Management & Environmental Sciences' },\n    { g: 'needs', e: 'Safety', sheet: 'https://berkeley.box.com/s/sar6uii4swwlx4o0ndy8idrqw9rk7l3t', prof: 'https://nicjr.org/Our-Team/#', r: 'Consolidate community-centered and public health violence prevention initiatives into a single Office of Violence Prevention within the Department of Justice — aligning programs such as CalVIP, the Department of Public Health’s Injury and Violence Prevention initiatives, and the Department of Justice’s Office of Gun Violence Prevention — to create a cohesive statewide strategy and clarify these efforts as core public safety infrastructure.', who: 'Mikaela Rabinowitz', aff: 'National Institute for Criminal Justice Reform' },\n    { g: 'econ', e: 'Education', sheet: 'https://berkeley.box.com/s/cxcgnagvlbvcgfpfya1dlsm4zfq26trn', prof: 'https://bellwether.org/leaders/carrie-hahnel/', r: 'Restructure the state’s education governance system to create clearer lines of responsibility and accountability while strengthening its capacity for effective implementation.', who: 'Carrie Hahnel', aff: 'Bellwether Education Partners' },\n    { g: 'econ', e: 'Employment', sheet: 'https://berkeley.box.com/s/0x1i7gt1tm9qr26oofp70ro5fhgu6uyg', prof: 'https://laborcenter.berkeley.edu/people/anibel-ferus-comelo/', r: 'Institutionalize tripartite collaboratives between the state, labor unions, and employers — and link them to workforce boards, training institutions, and community-based organizations — to expand registered pre-apprenticeships, apprenticeships, and high-road training partnerships.', who: 'Anibel Ferus-Comelo', aff: 'UC Berkeley Labor Center' },\n    { g: 'econ', e: 'Digital Connectivity', sheet: 'https://berkeley.box.com/s/b3mo0lqay1mabpvs7d5vjn3d58pzxtw9', prof: 'https://profiles.ucr.edu/app/home/profile/eheldero', r: 'Require internet service providers (ISPs) to maintain publicly available data on broadband provision and allow cooperatives to connect directly to the state’s middle-mile network at cost-based rates.', who: 'Edward E. Helderop', aff: 'UC Riverside Center for Geospatial Sciences' },\n    { g: 'care', e: 'Childcare', sheet: 'https://berkeley.box.com/s/zx38cwy4ruqgyhdvwwbdtlhgzwli47tb', prof: 'https://cscce.berkeley.edu/people/anna-powell/', r: 'Reform the state’s funding formula for early care and education (ECE) and pay based on the true cost of care to stabilize existing providers and lay the foundation for universal access.', who: 'Anna Powell', aff: 'UC Berkeley Center for the Study of Child Care Employment' },\n    { g: 'care', e: 'Healthcare', sheet: 'https://berkeley.box.com/s/0bcnbbaif12hbljtbb3qd1wo3cvsp1ff', prof: 'https://lwhconsult.com/about', r: 'Invest in upstream social factors that improve health while strengthening the medical workforce by increasing clinical training slots, reducing licensing barriers to qualified foreign doctors, and supporting access to telehealth.', who: 'Leif Wellington Haase', aff: 'LWH Consulting' },\n    { g: 'care', e: 'Eldercare', sheet: 'https://berkeley.box.com/s/6cqhdxx1lv33en9awyv7ckoi4mxi8oz3', prof: 'https://schaeffer.usc.edu/people/mireille-jacobson-phd/', r: 'Reduce regulatory and licensure barriers to expand mid-level eldercare options by easing restrictive requirements and incentivizing new residential care models.', who: 'Mireille Jacobson', aff: 'USC Leonard Davis School of Gerontology' }\n  ];\n  const esc = (s) => s.replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;');\n  const cardsEl = document.getElementById('cards');\n  if (!cardsEl) return;\n  cardsEl.innerHTML = DATA.map((d) =>\n    '<article class=\"card\" data-cat=\"' + d.g + '\" style=\"--c:' + GROUPS[d.g].c + '\">' +\n    '<p class=\"grp\">' + GROUPS[d.g].n + '<\u002Fp><h3><a href=\"' + d.sheet + '\" target=\"_blank\" rel=\"noopener\">' + esc(d.e) + '<\u002Fa><\u002Fh3>' +\n    '<p class=\"body\">' + esc(d.r) + '<\u002Fp>' +\n    '<p class=\"who\"><b><a href=\"' + d.prof + '\" target=\"_blank\" rel=\"noopener\">' + esc(d.who) + '<\u002Fa><\u002Fb><span>' + esc(d.aff) + '<\u002Fspan><\u002Fp><\u002Farticle>').join('');\n\n  /* ring of twelve interconnected essentials */\n  const ring = document.getElementById('ring');\n  const NS = 'http://www.w3.org/2000/svg';\n  const mk = (t, a) => { const el = document.createElementNS(NS, t); for (const k in a) el.setAttribute(k, a[k]); return el; };\n  const C = 220, R = 150;\n  const pts = DATA.map((d, i) => { const a = -Math.PI / 2 + i * Math.PI * 2 / 12; return { x: C + R * Math.cos(a), y: C + R * Math.sin(a), a, d }; });\n  ring.appendChild(mk('circle', { class: 'halo', cx: C, cy: C, r: R }));\n  ring.appendChild(mk('circle', { class: 'halo', cx: C, cy: C, r: R * .55 }));\n  const chords = [];\n  pts.forEach((p, i) => {\n    [3, 5, 7].forEach((k) => {\n      const q = pts[(i + k) % 12]; if (i > (i + k) % 12) return;\n      const path = mk('path', { class: 'chord', d: 'M' + p.x + ' ' + p.y + ' Q' + C + ' ' + C + ' ' + q.x + ' ' + q.y, pathLength: 1 });\n      path.dataset.g = p.d.g + ' ' + q.d.g; path.style.transitionDelay = (i * 0.06) + 's';\n      ring.appendChild(path); chords.push(path);\n    });\n  });\n  const nodes = pts.map((p) => {\n    const g = mk('g', { class: 'node', tabindex: 0, role: 'button' }); g.dataset.g = p.d.g;\n    g.appendChild(mk('circle', { cx: p.x, cy: p.y, r: 6.5, fill: GROUPS[p.d.g].c }));\n    const out = p.x > C + 1 ? 'start' : p.x < C - 1 ? 'end' : 'middle';\n    const tx = p.x + Math.cos(p.a) * 18, ty = p.y + Math.sin(p.a) * 18 + (out === 'middle' ? (p.y < C ? -6 : 14) : 4);\n    const t = mk('text', { x: tx, y: ty, 'text-anchor': out }); t.textContent = p.d.e; g.appendChild(t);\n    g.appendChild(mk('title', {})).textContent = p.d.e + ' — ' + GROUPS[p.d.g].n;\n    ring.appendChild(g); return g;\n  });\n\n  const filters = document.getElementById('filters');\n  const setFilter = (cat) => {\n    filters.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.cat === cat)));\n    cardsEl.querySelectorAll('.card').forEach((c) => {\n      const show = cat === 'all' || c.dataset.cat === cat;\n      c.classList.toggle('hide', !show);\n      if (show) { c.style.animation = 'none'; void c.offsetWidth; c.style.animation = ''; }\n    });\n    ring.classList.toggle('filtered', cat !== 'all');\n    nodes.forEach((n) => n.classList.toggle('on', n.dataset.g === cat));\n    chords.forEach((p) => p.classList.toggle('on', p.dataset.g.split(' ').includes(cat)));\n  };\n  filters.addEventListener('click', (e) => { const btn = e.target.closest('.chip'); if (btn) setFilter(btn.dataset.cat); });\n  nodes.forEach((n) => {\n    const go = () => { const cur = filters.querySelector('[aria-pressed=\"true\"]').dataset.cat; setFilter(cur === n.dataset.g ? 'all' : n.d
